# Valida todo PR (e pushes fora da main): lint, tipos, schema, build, links, testes e Lighthouse.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ESLint + Prettier
      - run: npm run lint
      # Checagem de tipos (TS + .astro)
      - run: npm run check
      # Meta do MVP: mínimo de comandos por tecnologia
      - run: npm run count
      # Testes de unidade: schema Zod dos YAML, regras entre arquivos, verificador de links
      - run: npm test
      # O build também valida os YAML (Content Collections) e falha se algo estiver incompleto
      - run: npm run build
      - run: npm run check:links

      # Smoke test no navegador: páginas, filtro, copiar e busca de todos os comandos
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Lighthouse ≥ 95 em performance, acessibilidade e SEO (lighthouserc.json)
      - run: npx @lhci/cli@0.15.1 autorun
