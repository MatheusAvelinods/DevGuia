# Publica o site no GitHub Pages a cada push na main.
# Pré-requisito: Settings → Pages → Source = "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Navegador para gerar o cheatsheet.pdf
      - run: npx playwright install --with-deps chromium
      # astro build (site + cheatsheet.md/.html em dist/downloads/) + PDF via Playwright
      - run: npm run build
      - run: npm run check:links
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
